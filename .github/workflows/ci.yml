name: API checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: forge_ci
          POSTGRES_USER: forge
          POSTGRES_DB: forge
        ports: [5432:5432]
        options: --health-cmd "pg_isready -U forge" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://forge:forge_ci@localhost:5432/forge?sslmode=disable
      GIN_MODE: release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: test -z "$(gofmt -l cmd internal sdk)"
      - run: go test -tags=nomsgpack -race -count=1 ./...
      - run: go vet -tags=nomsgpack ./...
      - run: go build -tags=nomsgpack ./cmd/server
      - uses: azure/setup-helm@v4.3.0
        with:
          version: v3.17.3
      - run: helm lint charts/forge-tenant
      - run: docker build -t forge-tenant-api:ci .
