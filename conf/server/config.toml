AppName = "forge-tenant"
AppCode = 101
RunMode = "release"

[HTTPServer]
Listen = "${env: LISTEN_ADDR::8080}"
ReadTimeout = 30000
WriteTimeout = 35000
IdleTimeout = 60000
APIBasePath = ""

[Log]
Level = "Info"
[[Log.Outputs]]
Type = "Console"

[DB]
Driver = "PostgreSQL"
DSN = "${env: DATABASE_URL:}"
MaxOpenConns = 12
MaxIdleConns = 12

[Tenant]
PublicURL = "${env: PUBLIC_URL:}"
CAFile = "${env: CA_FILE:}"
# Encrypts persisted idempotency responses. Keep the existing key value when renaming the environment variable.
EncryptionKey = "${env: TENANT_ENCRYPTION_KEY:}"

[Gitlab]
URL = "${env: GITLAB_URL:}"
PublicURL = "${env: GITLAB_PUBLIC_URL:}"
ClientID = "${env: GITLAB_OIDC_CLIENT_ID:}"
Token = "${env: GITLAB_TOKEN:}"
TokenFile = "${env: GITLAB_TOKEN_FILE:}"

[Casdoor]
URL = "${env: CASDOOR_URL:}"
ClientID = "${env: CASDOOR_CLIENT_ID:}"
Secret = "${env: CASDOOR_SECRET:}"
Organization = "${env: CASDOOR_ORGANIZATION:}"
Issuer = "${env: OIDC_ISSUER:}"
OIDCClientID = "${env: OIDC_CLIENT_ID:}"
OIDCClientSecret = "${env: OIDC_CLIENT_SECRET:}"

# Optional. New tenants always record a durable obligation; the worker starts
# storage preparation only when this endpoint and its independent credential are set.
[Storage]
URL = "${env: STORAGE_URL:}"
ManagementToken = "${env: STORAGE_MANAGEMENT_TOKEN:}"
 # Timeout defaults to 15s; an explicit duration must be between 1s and 1m.
