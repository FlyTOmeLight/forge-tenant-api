AppName = "forge-tenant"
AppCode = 101
RunMode = "release"

[HTTPServer]
Listen = "${env: LISTEN_ADDR::8080}"
ReadTimeout = 30000
WriteTimeout = 35000
IdleTimeout = 60000
APIBasePath = ""

[Log]
Level = "Info"
[[Log.Outputs]]
Type = "Console"

[Forge]
DatabaseURL = "${env: DATABASE_URL:}"
PublicURL = "${env: PUBLIC_URL:}"
BootstrapUser = "${env: BOOTSTRAP_USERNAME:}"
AppKey = "${env: APP_KEY:}"
ServiceToken = "${env: SERVICE_TOKEN:}"
CAFile = "${env: CA_FILE:}"
ModelURL = "${env: MODEL_URL:}"

[Gitlab]
URL = "${env: GITLAB_URL:}"
PublicURL = "${env: GITLAB_PUBLIC_URL:}"
ClientID = "${env: GITLAB_OIDC_CLIENT_ID:}"
Token = "${env: GITLAB_TOKEN:}"
TokenFile = "${env: GITLAB_TOKEN_FILE:}"

[Casdoor]
URL = "${env: CASDOOR_URL:}"
ClientID = "${env: CASDOOR_CLIENT_ID:}"
Secret = "${env: CASDOOR_SECRET:}"
Organization = "${env: CASDOOR_ORGANIZATION:}"
Issuer = "${env: OIDC_ISSUER:}"
OIDCClientID = "${env: OIDC_CLIENT_ID:}"
OIDCClientSecret = "${env: OIDC_CLIENT_SECRET:}"
