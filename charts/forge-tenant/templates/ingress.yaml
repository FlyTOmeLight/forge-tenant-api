{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "forge-tenant.fullname" . }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  tls:
    - hosts: [{{ required "ingress.host is required" .Values.ingress.host | quote }}]
      secretName: {{ if .Values.global.forge.enabled }}{{ .Release.Name }}-tls{{ else }}{{ required "ingress.tlsSecret is required" .Values.ingress.tlsSecret }}{{ end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          {{- range list "/api/" "/auth/" "/internal/" }}
          - path: {{ . }}
            pathType: Prefix
            backend:
              service:
                name: {{ include "forge-tenant.fullname" $ }}
                port: {number: 80}
          {{- end }}
{{- end }}
