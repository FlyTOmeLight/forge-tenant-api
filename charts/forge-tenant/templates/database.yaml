{{- if .Values.postgres.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "forge-tenant.fullname" . }}-postgres
spec:
  selector: {app: {{ include "forge-tenant.fullname" . }}-postgres}
  ports: [{port: 5432, targetPort: 5432}]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "forge-tenant.fullname" . }}-postgres
spec:
  serviceName: {{ include "forge-tenant.fullname" . }}-postgres
  replicas: 1
  persistentVolumeClaimRetentionPolicy: {whenDeleted: Retain, whenScaled: Retain}
  selector:
    matchLabels: {app: {{ include "forge-tenant.fullname" . }}-postgres}
  template:
    metadata:
      labels: {app: {{ include "forge-tenant.fullname" . }}-postgres}
    spec:
      automountServiceAccountToken: false
      containers:
        - name: postgres
          image: {{ .Values.postgres.image | quote }}
          env:
            - {name: POSTGRES_DB, value: forge}
            - {name: POSTGRES_USER, value: forge}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: {name: {{ include "forge-tenant.envSecret" . }}, key: POSTGRES_PASSWORD}
            - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
          ports: [{containerPort: 5432}]
          readinessProbe:
            exec: {command: [pg_isready, -h, 127.0.0.1, -U, forge, -d, forge]}
            initialDelaySeconds: 5
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {memory: 512Mi}
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql/data}
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: [ReadWriteOnce]
        {{- if .Values.postgres.storageClass }}
        storageClassName: {{ .Values.postgres.storageClass | quote }}
        {{- end }}
        resources:
          requests: {storage: {{ .Values.postgres.storage | quote }}}
{{- end }}
