apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Name }}-workspace
  namespace: {{ .Release.Namespace }}
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
spec:
  replicas: {{ .Values.replicas }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 20
      containers:
        - name: executor
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: IfNotPresent
          envFrom:
            - secretRef:
                name: {{ .Values.existingSecret }}
          env:
            - name: SERVICE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.platformSecret }}
                  key: SERVICE_TOKEN
            - name: FORGE_URL
              value: {{ .Values.forgeURL | quote }}
            - name: GITLAB_URL
              value: {{ .Values.gitlabURL | quote }}
            - name: MODEL_URL
              value: {{ .Values.modelURL | quote }}
            - name: GITLAB_PROJECT_ID
              value: {{ .Values.gitlabProjectID | quote }}
            - name: WORKSPACE_ROOT
              value: /workspace
            - name: WORKER_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 2Gi
          volumeMounts:
            - name: workspace
              mountPath: /workspace
      volumes:
        - name: workspace
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-workspace
